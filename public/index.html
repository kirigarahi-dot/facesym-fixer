<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ブロック崩し</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .wrap { text-align:center; }
    canvas { background:#020617; border:2px solid #334155; border-radius:8px; box-shadow:0 12px 30px rgba(0,0,0,.35); }
    p { margin:.5rem 0 0; color:#94a3b8; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ブロック崩し</h1>
    <canvas id="game" width="720" height="480"></canvas>
    <p>← → で移動 / スペースで開始・再開</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const paddle = { w: 110, h: 14, x: canvas.width / 2 - 55, speed: 8 };
    const ball = { x: canvas.width / 2, y: canvas.height - 70, r: 8, dx: 4, dy: -4 };

    const brick = { rows: 6, cols: 10, w: 62, h: 20, pad: 8, top: 60, left: 16 };
    const bricks = [];

    let rightPressed = false;
    let leftPressed = false;
    let score = 0;
    let lives = 3;
    let running = false;
    let gameOver = false;
    let win = false;

    function resetBricks() {
      bricks.length = 0;
      for (let c = 0; c < brick.cols; c++) {
        bricks[c] = [];
        for (let r = 0; r < brick.rows; r++) bricks[c][r] = { x: 0, y: 0, alive: true };
      }
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 70;
      ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -4;
      paddle.x = canvas.width / 2 - paddle.w / 2;
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(paddle.x, canvas.height - paddle.h - 14, paddle.w, paddle.h);
    }

    function drawBricks() {
      const colors = ['#e11d48', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];
      for (let c = 0; c < brick.cols; c++) {
        for (let r = 0; r < brick.rows; r++) {
          if (!bricks[c][r].alive) continue;
          const x = c * (brick.w + brick.pad) + brick.left;
          const y = r * (brick.h + brick.pad) + brick.top;
          bricks[c][r].x = x;
          bricks[c][r].y = y;
          ctx.fillStyle = colors[r % colors.length];
          ctx.fillRect(x, y, brick.w, brick.h);
        }
      }
    }

    function drawHUD() {
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '16px system-ui';
      ctx.fillText(`Score: ${score}`, 16, 26);
      ctx.fillText(`Lives: ${lives}`, canvas.width - 90, 26);

      if (!running && !gameOver && !win) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 26px system-ui';
        ctx.fillText('スペースで開始', canvas.width / 2 - 95, canvas.height / 2);
      }
      if (gameOver) {
        ctx.fillStyle = '#fb7185';
        ctx.font = 'bold 34px system-ui';
        ctx.fillText('GAME OVER', canvas.width / 2 - 120, canvas.height / 2);
        ctx.font = '18px system-ui';
        ctx.fillText('スペースでリトライ', canvas.width / 2 - 85, canvas.height / 2 + 34);
      }
      if (win) {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 34px system-ui';
        ctx.fillText('YOU WIN!', canvas.width / 2 - 95, canvas.height / 2);
        ctx.font = '18px system-ui';
        ctx.fillText('スペースでもう一度', canvas.width / 2 - 90, canvas.height / 2 + 34);
      }
    }

    function collisionDetection() {
      for (let c = 0; c < brick.cols; c++) {
        for (let r = 0; r < brick.rows; r++) {
          const b = bricks[c][r];
          if (!b.alive) continue;
          if (ball.x > b.x && ball.x < b.x + brick.w && ball.y > b.y && ball.y < b.y + brick.h) {
            ball.dy = -ball.dy;
            b.alive = false;
            score++;
            if (score === brick.rows * brick.cols) {
              running = false;
              win = true;
            }
          }
        }
      }
    }

    function update() {
      if (!running) return;

      if (rightPressed && paddle.x < canvas.width - paddle.w) paddle.x += paddle.speed;
      if (leftPressed && paddle.x > 0) paddle.x -= paddle.speed;

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) ball.dx = -ball.dx;
      if (ball.y - ball.r < 0) ball.dy = -ball.dy;

      const paddleY = canvas.height - paddle.h - 14;
      if (ball.y + ball.r > paddleY && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.dx = hitPos * 6;
        ball.dy = -Math.abs(ball.dy);
      }

      if (ball.y + ball.r > canvas.height) {
        lives--;
        if (lives <= 0) {
          running = false;
          gameOver = true;
        } else {
          resetBall();
          running = false;
        }
      }

      collisionDetection();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
      drawHUD();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
      if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
      if (e.code === 'Space') {
        if (gameOver || win) {
          score = 0; lives = 3; gameOver = false; win = false; resetBricks(); resetBall();
        }
        running = true;
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
      if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
    });

    resetBricks();
    draw();
    loop();
  </script>
</body>
</html>
